<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="utf-8">
  <style>
  :root {
    --azul: #0b5cad; --azul-escuro: #083f78; --azul-claro: #e8f1fb;
    --verde: #1a7f4b; --verde-claro: #e3f4ea;
    --laranja: #a65300; --laranja-claro: #fdf0e1;
    --vermelho: #b42318; --vermelho-claro: #fdecea;
    --roxo: #6941c6; --roxo-claro: #f1ecfb;
    --texto: #1d2330; --texto-2: #4a5263; --texto-3: #6b7385;
    --borda: #d5d9e0; --fundo: #f3f5f8; --superficie: #ffffff;
    --raio: 10px;
    --sombra: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .10);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--fundo); color: var(--texto);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 15px; line-height: 1.45;
  }
  a { color: var(--azul); }

  .topo { background: var(--azul); color: #fff; padding: 12px 16px; }
  .topo-conteudo { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .marca { display: flex; flex-direction: column; line-height: 1.2; }
  .marca small { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
  .marca strong { font-size: 18px; }

  .container { max-width: 760px; margin: 24px auto; padding: 0 16px; }
  .cartao { background: var(--superficie); border-radius: var(--raio); box-shadow: var(--sombra); padding: 24px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 17px; margin: 0 0 12px; }
  h3 { font-size: 15px; margin: 0 0 10px; }
  .sub { color: var(--texto-3); margin: 0 0 20px; }

  .campo { margin-bottom: 16px; }
  label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  .obrig { color: var(--vermelho); }
  .dica { font-weight: 400; color: var(--texto-3); font-size: 13px; }
  input[type=text], input[type=email], input[type=tel], input[type=password], input[type=search], select, textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--borda); border-radius: 8px;
    font: inherit; color: inherit; background: #fff;
  }
  textarea { min-height: 110px; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--azul); outline-offset: -1px; border-color: var(--azul); }
  .check { display: flex; gap: 8px; align-items: flex-start; font-weight: 400; margin-top: 8px; cursor: pointer; }
  .check input { margin-top: 3px; }
  .grade-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }

  .botao {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 10px 18px; border-radius: 8px; border: 1px solid transparent;
    font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap;
  }
  .botao-primario { background: var(--azul); color: #fff; }
  .botao-primario:hover { background: var(--azul-escuro); }
  .botao-secundario { background: #fff; color: var(--texto); border-color: var(--borda); }
  .botao-secundario:hover { background: var(--fundo); }
  .botao-claro { background: rgba(255, 255, 255, .15); color: #fff; border-color: rgba(255, 255, 255, .35); padding: 7px 14px; }
  .botao-claro:hover { background: rgba(255, 255, 255, .25); }
  .botao[disabled] { opacity: .6; cursor: wait; }
  .botao-bloco { width: 100%; padding: 13px; font-size: 16px; }

  .alerta { padding: 12px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
  .alerta-erro { background: var(--vermelho-claro); color: var(--vermelho); }
  .alerta-info { background: var(--azul-claro); color: var(--azul-escuro); }

  .selo { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .st-aberto { background: var(--azul-claro); color: var(--azul); }
  .st-em-atendimento { background: var(--laranja-claro); color: var(--laranja); }
  .st-aguardando { background: var(--roxo-claro); color: var(--roxo); }
  .st-concluido { background: var(--verde-claro); color: var(--verde); }
  .st-cancelado { background: var(--fundo); color: var(--texto-3); border: 1px solid var(--borda); }
  .pr-urgente { background: var(--vermelho); color: #fff; }
  .pr-alta { background: var(--vermelho-claro); color: var(--vermelho); }
  .pr-media { background: var(--fundo); color: var(--texto-2); }
  .pr-baixa { background: #fff; color: var(--texto-3); border: 1px solid var(--borda); }

  .linha-tempo { list-style: none; margin: 0; padding: 0; }
  .linha-tempo li { position: relative; padding: 0 0 16px 22px; }
  .linha-tempo li::before { content: ""; position: absolute; left: 4px; top: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--azul); }
  .linha-tempo li::after { content: ""; position: absolute; left: 8px; top: 18px; bottom: 0; width: 1px; background: var(--borda); }
  .linha-tempo li:last-child::after { display: none; }
  .linha-tempo li.interna::before { background: var(--texto-3); }
  .lt-meta { font-size: 12px; color: var(--texto-3); }
  .lt-texto { white-space: pre-wrap; word-break: break-word; }

  .rodape-links { text-align: center; margin: 20px 0 40px; font-size: 14px; color: var(--texto-3); }
  .oculto { display: none !important; }
  .girando { display: inline-block; width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: girar .7s linear infinite; vertical-align: -3px; }
  @keyframes girar { to { transform: rotate(360deg); } }

  @media (max-width: 600px) {
    .grade-2 { grid-template-columns: 1fr; }
    .cartao { padding: 18px; }
    .container { margin-top: 16px; }
  }
</style>
<script>
  // Duas formas de rodar: dentro do Google (google.script.run) ou na intranet (APP.api, via fetch).
  function chamar(fn) {
    const args = Array.prototype.slice.call(arguments, 1);
    if (APP.api) return chamarApi(APP.api, fn, args);
    return new Promise((ok, falha) => {
      const runner = google.script.run.withSuccessHandler(ok).withFailureHandler(falha);
      runner[fn].apply(runner, args);
    });
  }
  // Sem cookies: o login do Google no navegador não interfere (evita o erro de várias contas)
  async function chamarApi(url, acao, args) {
    let r;
    try {
      r = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ acao: acao, args: args || [] }),
        credentials: 'omit',
        redirect: 'follow'
      });
    } catch (e) {
      throw new Error('Sem conexão com o servidor. Verifique a internet e tente de novo.');
    }
    const j = await r.json();
    if (!j.ok) throw new Error(j.erro);
    return j.dados;
  }
  // Endereço de outra tela do sistema
  function link(pagina, protocolo) {
    const extra = protocolo ? 'protocolo=' + encodeURIComponent(protocolo) : '';
    if (APP.api) return pagina + '.html?equipe=' + APP.chave + (extra ? '&' + extra : '');
    const q = [pagina === 'abrir' ? '' : 'p=' + pagina, extra].filter(Boolean).join('&');
    return APP.urlBase + (q ? '?' + q : '');
  }
  function mensagemErro(e) {
    return String((e && e.message) || e).replace(/^(Exception|Error|Erro):\s*/i, '');
  }
  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function slug(v) {
    return String(v || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, '-');
  }
  function preencherCabecalho(prefixo) {
    document.querySelectorAll('.unidade').forEach(el => { el.textContent = APP.unidade; });
    document.querySelectorAll('.titulo-equipe').forEach(el => { el.textContent = (prefixo || 'Chamados de ') + APP.equipe; });
  }
  function seloStatus(s) { return '<span class="selo st-' + slug(s) + '">' + esc(s) + '</span>'; }
  function seloPrioridade(p) { return '<span class="selo pr-' + slug(p) + '">' + esc(p) + '</span>'; }
  function dataHora(ms) {
    if (!ms) return '—';
    const d = new Date(ms);
    return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }
  function tempoDesde(ms) {
    if (!ms) return '—';
    const min = Math.floor((Date.now() - ms) / 60000);
    if (min < 1) return 'agora';
    if (min < 60) return 'há ' + min + ' min';
    const h = Math.floor(min / 60);
    if (h < 24) return 'há ' + h + ' h';
    const d = Math.floor(h / 24);
    return 'há ' + d + (d === 1 ? ' dia' : ' dias');
  }
</script>

  <script src="config.js"></script>
  <style>
    .prioridades { display: flex; gap: 8px; flex-wrap: wrap; }
    .prioridades label { margin: 0; padding: 8px 14px; border: 1px solid var(--borda); border-radius: 999px; font-weight: 500; cursor: pointer; }
    .prioridades input { position: absolute; opacity: 0; pointer-events: none; }
    .prioridades label:has(input:checked) { background: var(--azul); border-color: var(--azul); color: #fff; }
    .prioridades label:has(input:focus-visible) { outline: 2px solid var(--azul); outline-offset: 2px; }
    .prioridades label.urgente:has(input:checked) { background: var(--vermelho); border-color: var(--vermelho); }

    .armadilha { position: absolute; left: -9999px; }
    .sucesso { text-align: center; }
    .sucesso-icone { width: 64px; height: 64px; margin: 4px auto 12px; border-radius: 50%; background: var(--verde-claro); color: var(--verde); display: grid; place-items: center; }
    .protocolo { font-size: 30px; font-weight: 700; letter-spacing: .04em; color: var(--azul-escuro); margin: 8px 0 4px; font-variant-numeric: tabular-nums; }
    .botoes { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
  </style>
</head>
<body>
  <header class="topo">
    <div class="topo-conteudo">
      <div class="marca"><small class="titulo-equipe"></small><strong class="unidade"></strong></div>
    </div>
  </header>

  <main class="container">
    <form id="form" class="cartao" novalidate>
      <h1 id="titulo"></h1>
      <p class="sub"><span id="descricao-equipe"></span>. Você vai receber um número de protocolo para acompanhar o atendimento.</p>
      <div id="erro" class="alerta alerta-erro oculto" role="alert"></div>

      <div class="grade-2">
        <div class="campo">
          <label for="solicitante">Seu nome <span class="obrig">*</span></label>
          <input type="text" id="solicitante" name="solicitante" maxlength="100" autocomplete="name">
        </div>
        <div class="campo">
          <label for="setor">Setor / Local <span class="obrig">*</span></label>
          <input type="text" id="setor" name="setor" maxlength="100" list="lista-setores" placeholder="Ex.: Guichê 5, Consultório 2">
          <datalist id="lista-setores"></datalist>
        </div>
        <div class="campo">
          <label for="telefone">Ramal / Telefone</label>
          <input type="tel" id="telefone" name="telefone" maxlength="40">
        </div>
        <div class="campo">
          <label for="email">E-mail <span class="dica">(opcional, para receber atualizações)</span></label>
          <input type="email" id="email" name="email" maxlength="120" autocomplete="email">
        </div>
      </div>

      <div class="campo">
        <label for="categoria">Categoria <span class="obrig">*</span></label>
        <select id="categoria" name="categoria"></select>
      </div>

      <div class="campo">
        <label>Prioridade</label>
        <div class="prioridades" id="prioridades" role="radiogroup"></div>
        <div class="dica" style="margin-top:6px">Urgente: atendimento ao público parado ou risco à segurança.</div>
      </div>

      <div class="campo">
        <label for="assunto">Assunto <span class="obrig">*</span></label>
        <input type="text" id="assunto" name="assunto" maxlength="120">
      </div>

      <div class="campo">
        <label for="descricao">Descrição do problema <span class="obrig">*</span></label>
        <textarea id="descricao" name="descricao" maxlength="4000" placeholder="O que aconteceu, desde quando e se há mensagem de erro."></textarea>
      </div>

      <div class="campo">
        <label for="anexo">Foto ou PDF <span class="dica">(opcional)</span></label>
        <input type="file" id="anexo" accept="image/*,application/pdf">
      </div>

      <div class="armadilha" aria-hidden="true">
        <label for="site">Não preencha</label>
        <input type="text" id="site" name="site" tabindex="-1" autocomplete="off">
      </div>

      <button type="submit" id="enviar" class="botao botao-primario botao-bloco">Enviar chamado</button>
    </form>

    <section id="sucesso" class="cartao sucesso oculto" aria-live="polite">
      <div class="sucesso-icone" aria-hidden="true">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>
      </div>
      <h1>Chamado registrado</h1>
      <p class="sub" style="margin:0">Anote o número do protocolo:</p>
      <div class="protocolo" id="protocolo"></div>
      <p class="sub" id="sucesso-email"></p>
      <div class="botoes">
        <a id="link-acompanhar" class="botao botao-secundario" href="#">Acompanhar este chamado</a>
        <button type="button" id="novo" class="botao botao-primario">Abrir outro chamado</button>
      </div>
    </section>

    <p class="rodape-links">
      <a id="link-consulta" href="#">Acompanhar um chamado</a> · <a id="link-painel" href="#">Área do técnico</a>
    </p>
  </main>

  <script type="text/plain" id="principal">
    const APP = window.APP;
    const $ = s => document.querySelector(s);
    const form = $('#form');
    const MEMORIA = 'chamados.solicitante';

    preencherCabecalho();
    $('#titulo').textContent = 'Abrir chamado de ' + APP.equipe;
    $('#descricao-equipe').textContent = APP.descricao;
    $('#assunto').placeholder = APP.equipe === 'TI'
      ? 'Ex.: Impressora do guichê 3 não imprime'
      : 'Ex.: Lâmpada queimada no consultório 2';
    $('#link-consulta').href = link('consulta');
    $('#link-painel').href = link('painel');

    $('#lista-setores').innerHTML = APP.setores.map(s => '<option value="' + esc(s) + '">').join('');
    $('#categoria').innerHTML = '<option value="">Selecione…</option>' +
      APP.categorias.map(c => '<option>' + esc(c) + '</option>').join('');
    $('#prioridades').innerHTML = APP.prioridades.map(p =>
      '<label class="' + (p === 'Urgente' ? 'urgente' : '') + '"><input type="radio" name="prioridade" value="' + esc(p) + '"' +
      (p === 'Média' ? ' checked' : '') + '> ' + esc(p) + '</label>').join('');

    // Lembra nome, setor e contato neste computador
    function lerMemoria() {
      try { return JSON.parse(localStorage.getItem(MEMORIA)) || {}; } catch (e) { return {}; }
    }
    function salvarMemoria(d) {
      try { localStorage.setItem(MEMORIA, JSON.stringify(d)); } catch (e) { /* navegador sem armazenamento */ }
    }
    function preencherMemoria() {
      const m = lerMemoria();
      ['solicitante', 'setor', 'telefone', 'email'].forEach(k => { if (m[k]) form.elements[k].value = m[k]; });
    }
    preencherMemoria();

    function mostrarErro(msg) {
      const el = $('#erro');
      el.textContent = msg;
      el.classList.remove('oculto');
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function lerArquivo(arquivo) {
      return new Promise((ok, falha) => {
        const r = new FileReader();
        r.onload = () => ok({ nome: arquivo.name, tipo: arquivo.type, base64: String(r.result).split(',')[1] });
        r.onerror = () => falha(new Error('Não foi possível ler o anexo.'));
        r.readAsDataURL(arquivo);
      });
    }

    // Fotos de celular costumam ter mais de 5 MB: reduz para no máximo 1600 px
    function reduzirImagem(arquivo) {
      return new Promise((ok, falha) => {
        const url = URL.createObjectURL(arquivo);
        const img = new Image();
        img.onload = () => {
          const escala = Math.min(1, 1600 / Math.max(img.width, img.height));
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * escala);
          canvas.height = Math.round(img.height * escala);
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          URL.revokeObjectURL(url);
          ok({
            nome: arquivo.name.replace(/\.[^.]+$/, '') + '.jpg',
            tipo: 'image/jpeg',
            base64: canvas.toDataURL('image/jpeg', 0.82).split(',')[1]
          });
        };
        img.onerror = () => { URL.revokeObjectURL(url); falha(); };
        img.src = url;
      });
    }

    async function prepararAnexo(arquivo) {
      if (/^image\//.test(arquivo.type) && arquivo.type !== 'image/gif') {
        try { return await reduzirImagem(arquivo); } catch (e) { /* formato que o navegador não abre: envia o original */ }
      }
      if (arquivo.size > 5 * 1024 * 1024) throw new Error('O anexo passa de 5 MB. Escolha um arquivo menor.');
      return lerArquivo(arquivo);
    }

    form.addEventListener('submit', async ev => {
      ev.preventDefault();
      $('#erro').classList.add('oculto');

      const el = form.elements;
      const prioridade = form.querySelector('input[name=prioridade]:checked');
      const dados = {
        solicitante: el.solicitante.value.trim(),
        setor: el.setor.value.trim(),
        telefone: el.telefone.value.trim(),
        email: el.email.value.trim(),
        categoria: el.categoria.value,
        prioridade: prioridade ? prioridade.value : 'Média',
        assunto: el.assunto.value.trim(),
        descricao: el.descricao.value.trim(),
        site: el.site.value
      };

      const faltando = [];
      if (!dados.solicitante) faltando.push('nome');
      if (!dados.setor) faltando.push('setor / local');
      if (!dados.categoria) faltando.push('categoria');
      if (!dados.assunto) faltando.push('assunto');
      if (!dados.descricao) faltando.push('descrição');
      if (faltando.length) return mostrarErro('Preencha: ' + faltando.join(', ') + '.');
      if (dados.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(dados.email)) return mostrarErro('Confira o e-mail informado.');

      const botao = $('#enviar');
      botao.disabled = true;
      botao.innerHTML = '<span class="girando"></span> Enviando…';
      try {
        const arquivo = $('#anexo').files[0];
        if (arquivo) dados.anexo = await prepararAnexo(arquivo);
        const r = await chamar('abrirChamado', dados);
        salvarMemoria({ solicitante: dados.solicitante, setor: dados.setor, telefone: dados.telefone, email: dados.email });
        $('#protocolo').textContent = r.protocolo;
        $('#sucesso-email').textContent = dados.email
          ? 'Enviamos a confirmação para ' + dados.email + '.'
          : 'A equipe de ' + APP.equipe + ' já foi avisada.';
        $('#link-acompanhar').href = link('consulta', r.protocolo);
        form.classList.add('oculto');
        $('#sucesso').classList.remove('oculto');
        window.scrollTo(0, 0);
      } catch (e) {
        mostrarErro(mensagemErro(e));
      } finally {
        botao.disabled = false;
        botao.textContent = 'Enviar chamado';
      }
    });

    $('#novo').addEventListener('click', () => {
      form.reset();
      preencherMemoria();
      $('#sucesso').classList.add('oculto');
      form.classList.remove('oculto');
    });
  </script>
  <script>
    // Busca no Google os dados da tela (equipe, categorias...) e só então roda o script da página
    (async function () {
      const q = new URLSearchParams(location.search);
      const chave = q.get('equipe');
      const equipe = CHAMADOS.equipes[chave];
      if (!equipe) { location.replace('index.html'); return; }
      try {
        const app = await chamarApi(equipe.api, 'dadosTela', ['abrir']);
        window.APP = Object.assign(app, { api: equipe.api, chave: chave, protocolo: q.get('protocolo') || '' });
        document.title = 'Chamados de ' + app.equipe + ' — ' + app.unidade;
        const s = document.createElement('script');
        s.textContent = document.getElementById('principal').textContent;
        document.body.appendChild(s);
      } catch (e) {
        document.body.insertAdjacentHTML('beforeend',
          '<div class="container"><div class="alerta alerta-erro">Não foi possível carregar o sistema de chamados: ' +
          esc(mensagemErro(e)) + '</div></div>');
      }
    })();
  </script>
</body>
